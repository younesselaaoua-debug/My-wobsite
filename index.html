<div class="container">

    </button>

            -6.869 4.326-2.96-.924c-.64-.203-.658-.64.135
            -.954l11.566-4.458c.538-.196 1.006.128.832.94z"/>
        </svg>

    </button>

    Code copied!

<script>

/* =====================================================
   SETTINGS
===================================================== */

const TELEGRAM_LINK = "https://t.me/roblogiv";
const OFFER_PAGE_URL = "http://www.rob40.pro/?m=1";

const CODE_KEY = "reward_code_v3";


/* =====================================================
   GENERATE CODE
===================================================== */

function generateCode() {

    const characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

    let part1 = "";
    let part2 = "";

    for (let i = 0; i < 4; i++) {

        part1 += characters.charAt(
            Math.floor(Math.random() * characters.length)
        );

        part2 += characters.charAt(
            Math.floor(Math.random() * characters.length)
        );
    }

    return part1 + "-" + part2;
}


/* =====================================================
   LOAD CODE
===================================================== */

function loadCode() {

    let code = localStorage.getItem(CODE_KEY);

    /*
       IMPORTANT:
       If a code already exists,
       DO NOT generate another one.

       This is what prevents Refresh
       from changing the code.
    */

    if (!code) {

        code = generateCode();

        localStorage.setItem(
            CODE_KEY,
            code
        );
    }

    document.getElementById("codeDisplay")
        .textContent = code;
}


/* =====================================================
   GET CURRENT CODE
===================================================== */

function getCurrentCode() {

    return localStorage.getItem(CODE_KEY);
}


/* =====================================================
   COPY
===================================================== */

function copyCode() {

    const code = getCurrentCode();

    if (!code) return;

    const toast =
        document.getElementById("toast");

    const btn =
        document.getElementById("copyBtn");

    const btnText =
        document.getElementById("copyBtnText");


    navigator.clipboard.writeText(code)

    .then(function() {

        toast.classList.add("show");

        btn.classList.add("copied");

        btnText.textContent = "Code copied!";

        setTimeout(function() {

            toast.classList.remove("show");

            btn.classList.remove("copied");

            btnText.textContent = "Copy Code";

        }, 2000);

    })

    .catch(function() {

        const textarea =
            document.createElement("textarea");

        textarea.value = code;

        document.body.appendChild(textarea);

        textarea.select();

        document.execCommand("copy");

        textarea.remove();

        toast.classList.add("show");

        setTimeout(function() {
            toast.classList.remove("show");
        }, 2000);

    });
}


/* =====================================================
   TELEGRAM
===================================================== */

function sendTelegram() {

    /*
       Generate the NEXT code ONLY when
       the Telegram button is pressed.

       Refresh does NOT call this function.
    */

    const nextCode = generateCode();

    localStorage.setItem(
        CODE_KEY,
        nextCode
    );


    /*
       Open Telegram
    */

    window.open(
        TELEGRAM_LINK,
        "_blank"
    );


    /*
       Go to offer page
    */

    setTimeout(function() {

        window.location.href =
            OFFER_PAGE_URL;

    }, 700);
}


/* =====================================================
   START
===================================================== */

loadCode();

</script>

</body>
