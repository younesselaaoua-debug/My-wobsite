<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Your Reward Code</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 24px 16px;
            color: #1a202c;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 8px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 15px;
            color: #64748b;
            line-height: 1.5;
        }

        .code-box {
            width: 100%;
            background: #ffffff;
            border: 2px dashed #3b82f6;
            border-radius: 16px;
            padding: 32px 24px;
            text-align: center;
            margin: 16px 0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .code-label {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .code-value {
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
            font-size: 32px;
            font-weight: 700;
            color: #1e40af;
            letter-spacing: 2px;
            word-break: break-all;
            line-height: 1.3;
        }

        .btn {
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 56px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-copy {
            background: #3b82f6;
            color: #ffffff;
            box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.39);
        }

        .btn-copy:hover {
            background: #2563eb;
        }

        .btn-copy.copied {
            background: #10b981;
            box-shadow: 0 4px 14px 0 rgba(16, 185, 129, 0.39);
        }

        .btn-telegram {
            background: #ffffff;
            color: #0088cc;
            border: 2px solid #0088cc;
        }

        .btn-telegram:hover {
            background: #0088cc;
            color: #ffffff;
        }

        .icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #1e293b;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: #e2e8f0;
            margin: 8px 0;
        }

        .info-text {
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
            line-height: 1.5;
        }

        @media (max-width: 360px) {
            .header h1 {
                font-size: 24px;
            }
            .code-value {
                font-size: 26px;
            }
            .btn {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Your Reward Code</h1>
            <p>Your exclusive code is ready! Copy it now or send it via Telegram.</p>
        </div>

        <div class="code-box">
            <div class="code-label">Reward Code</div>
            <div class="code-value" id="codeDisplay">Generating...</div>
        </div>

        <button class="btn btn-copy" id="copyBtn" onclick="copyCode()">
            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
            </svg>
            <span id="copyBtnText">Copy Code</span>
        </button>

        <div class="divider"></div>

        <button class="btn btn-telegram" id="telegramBtn" onclick="sendTelegram()">
            <svg class="icon" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.14.18-.357.295-.6.295l.213-3.053 5.56-5.023c.242-.213-.054-.334-.373-.121l-6.869 4.326-2.96-.924c-.64-.203-.658-.64.135-.954l11.566-4.458c.538-.196 1.006.128.832.94z"/>
            </svg>
            <span>Send Code on Telegram</span>
        </button>

        <p class="info-text">
            This code is unique and valid for one-time use only.
        </p>
    </div>

    <div class="toast" id="toast">Code copied!</div>

    <script>
        // ==================== CONFIGURATION ====================
        // Edit these two variables as needed:
        const TELEGRAM_LINK = 'https://t.me/your_bot_username'; // ← Replace with your Telegram link
        const OFFER_PAGE_URL = 'https://example.com/offer';     // ← Replace with your Offer page URL
        // =======================================================

        const STORAGE_KEY = 'rewardCodeUsed';

        function generateRandomCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            const segments = 2;
            const segmentLength = 4;
            let code = '';

            for (let s = 0; s < segments; s++) {
                if (s > 0) code += '-';
                for (let i = 0; i < segmentLength; i++) {
                    code += chars.charAt(Math.floor(Math.random() * chars.length));
                }
            }

            return code;
        }

        function initPage() {
            const codeUsed = sessionStorage.getItem(STORAGE_KEY);

            if (codeUsed === 'true') {
                // Code was used before, generate new one
                sessionStorage.removeItem(STORAGE_KEY);
            }

            const newCode = generateRandomCode();
            document.getElementById('codeDisplay').textContent = newCode;
        }

        function getCurrentCode() {
            return document.getElementById('codeDisplay').textContent;
        }

        function copyCode() {
            const code = getCurrentCode();
            const btn = document.getElementById('copyBtn');
            const btnText = document.getElementById('copyBtnText');
            const toast = document.getElementById('toast');

            navigator.clipboard.writeText(code).then(() => {
                // Show toast
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);

                // Update button state
                btn.classList.add('copied');
                btnText.textContent = 'Code copied!';

                setTimeout(() => {
                    btn.classList.remove('copied');
                    btnText.textContent = 'Copy Code';
                }, 2000);
            }).catch(err => {
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = code;
                textArea.style.position = 'fixed';
                textArea.style.left = '-9999px';
                document.body.appendChild(textArea);
                textArea.select();

                try {
                    document.execCommand('copy');
                    toast.classList.add('show');
                    setTimeout(() => toast.classList.remove('show'), 2000);
                } catch (e) {
                    console.error('Copy failed:', e);
                }

                document.body.removeChild(textArea);
            });
        }

        function sendTelegram() {
            const code = getCurrentCode();

            // Mark code as used
            sessionStorage.setItem(STORAGE_KEY, 'true');

            // Open Telegram with pre-filled message (optional)
            const telegramUrl = TELEGRAM_LINK; // You can append ?start=CODE if using a bot

            // Open Telegram in new tab
            window.open(telegramUrl, '_blank');

            // Redirect to offer page after short delay
            setTimeout(() => {
                window.location.href = OFFER_PAGE_URL;
            }, 500);
        }

        // Initialize on page load
        initPage();
    </script>
</body>
</html>
