<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Congratulations You Won</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Tahoma, sans-serif;
      background:
        radial-gradient(circle at top, #294fb2 0%, #142d76 42%, #071642 100%);
      color: #fff;
    }
    .card {
      width: 100%;
      max-width: 430px;
      padding: 34px 24px 28px;
      text-align: center;
      border: 1px solid rgba(120, 175, 255, .35);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(19, 48, 119, .96), rgba(9, 31, 82, .98));
      box-shadow: 0 20px 55px rgba(0,0,0,.35);
    }
    .icon {
      width: 100px;
      height: 100px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 28px;
      font-size: 46px;
      background: linear-gradient(135deg, #12a9ff, #7a38e8);
      box-shadow: 0 12px 30px rgba(40, 124, 255, .35);
    }
    h1 {
      margin: 0 0 14px;
      font-size: 32px;
      line-height: 1.25;
      background: linear-gradient(90deg, #23d8ff, #8c5cff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .desc {
      margin: 0 auto 24px;
      max-width: 340px;
      color: #e8efff;
      font-size: 17px;
      line-height: 1.7;
    }
    .send-btn {
      display: block;
      width: 100%;
      padding: 17px 20px;
      border: 0;
      border-radius: 16px;
      text-decoration: none;
      color: white;
      font-size: 19px;
      font-weight: 700;
      background: linear-gradient(90deg, #168cff, #6c48ed);
      box-shadow: 0 10px 25px rgba(42, 120, 255, .3);
      transition: transform .2s, filter .2s;
      cursor: pointer;
    }
    .send-btn:hover { filter: brightness(1.08); transform: translateY(-2px); }
    .send-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .note { margin: 15px 0 0; color: #aebee8; font-size: 12px; }
    #msg { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>

  <main class="card">
    <div class="icon">🎁</div>

    <h1>Congratulations! You Won!</h1>

    <p class="desc">
      Click the button below to claim your prize now.
    </p>

    <!-- Form that sends to your Worker -->
    <form id="leadForm">
      <button class="send-btn" type="submit" id="btn">
        📤 Claim Your Prize
      </button>
    </form>

    <p id="msg" class="note"></p>
  </main>

<script>
const WORKER_URL = "https://tilgram-sand.aamirkhoya.workers.dev/"; // Your Worker URL

document.getElementById('leadForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');
    
    btn.disabled = true;
    msg.innerText = "Processing...";

    // Data sent to Worker
    const data = {
      username: "Visitor from Landing Page",
      page: "Prize Landing Page",
      time: new Date().toLocaleString("en-US")
    };

    try {
      const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
      });

      const result = await res.json();
      if(result.success){
          msg.innerText = "✅ " + result.message;
          msg.style.color = "#4ade80";
      }
    } catch(err) {
      msg.innerText = "❌ Error. Please try again.";
      msg.style.color = "#f87171";
    }
    
    btn.disabled = false;
});
</script>
</body>
</html>
